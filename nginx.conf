# nginx.conf - Production Server Configuration for G-Speed Esport Arena SPA on Coolify

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum payload size for exports, floor plans, and attachments
    client_max_body_size 25M;

    # Gzip Compression เพื่อความเร็วในการโหลดสูงสุด
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # Security Headers (Defense-in-Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Caching สำหรับ Static Assets (JavaScript, CSS, รูปภาพ, ฟอนต์)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # Caching สำหรับ index.html (ห้ามแคช เพื่อให้อัปเดตเวอร์ชันใหม่ได้ทันที)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        expires -1;
    }

    # Reverse Proxy สำหรับ Backend API & Hostinger SMTP Email Microservice
    # ใช้ dynamic resolver เพื่อให้ Nginx สตาร์ทได้ราบรื่น 100% ทั้งในโหมด Docker Compose และ Standalone Dockerfile
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://email-service:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # สำคัญที่สุด: HTML5 History API Clean URLs Routing
    # เมื่อเข้า /events, /events/slug, /activities, /franchise, /admin หรือกด Refresh จะไม่เจอ 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # หน้า Error มาตรฐาน
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
