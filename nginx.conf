# nginx.conf - Production Server Configuration for G-Speed Esport Arena SPA on Coolify

# Detect social media and search engine crawlers (LINE, Facebook, Twitter, Discord, WhatsApp, Googlebot, etc.)
map $http_user_agent $is_crawler {
    default 0;
    ~*Line 1;
    ~*Linespider 1;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*Discordbot 1;
    ~*TelegramBot 1;
    ~*WhatsApp 1;
    ~*SkypeUriPreview 1;
    ~*LinkedInBot 1;
    ~*Googlebot 1;
    ~*bingbot 1;
    ~*Applebot 1;
}

# Detect shareable article/tournament/event paths
map $uri $is_social_path {
    default 0;
    ~^/activities 1;
    ~^/tournaments 1;
    ~^/events 1;
    ~^/news 1;
}

# Combine flags: 11 means crawler on a social path
map $is_crawler$is_social_path $should_prerender {
    default 0;
    11 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum payload size for exports, floor plans, and attachments (increased to 50M for server CMS sync)
    client_max_body_size 50M;

    # Gzip Compression เพื่อความเร็วในการโหลดสูงสุด
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # Security Headers (Defense-in-Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Caching สำหรับ Static Assets (JavaScript, CSS, รูปภาพ, ฟอนต์)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # Caching สำหรับ index.html (ห้ามแคช เพื่อให้อัปเดตเวอร์ชันใหม่ได้ทันที)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        expires -1;
    }

    # Persistent Static Media Uploads Reverse Proxy (Decoupled from frontend build)
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Reverse Proxy สำหรับ Backend API & Hostinger SMTP Email Microservice
    # ส่งต่อไปยัง Node.js Backend ภายในคอนเทนเนอร์เดียวกัน (Port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
        client_max_body_size 50M;
    }

    # Direct proxy endpoint สำหรับ Dynamic Open Graph SSR Crawler
    location = /render-meta {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint สำหรับ Docker / Coolify / Monitoring
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # สำคัญที่สุด: HTML5 History API Clean URLs Routing พร้อมระบบ Open Graph SSR สำหรับ Social Crawlers (LINE, FB, Twitter, Discord)
    location / {
        if ($should_prerender = 1) {
            rewrite ^ /render-meta?url=$request_uri last;
        }

        try_files $uri $uri/ /index.html;
    }

    # หน้า Error มาตรฐาน
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
