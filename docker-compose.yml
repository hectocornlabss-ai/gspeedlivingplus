services:
  # 1. Frontend Web SPA & Nginx Server
  gspeed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gspeed-esport-arena
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - email-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - glp-network

  # 2. Hostinger SMTP & Notification Microservice (Node.js Express)
  email-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: glp-email-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - "SMTP_FROM_NAME=${SMTP_FROM_NAME:-GLP : G Speed Living Plus}"
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-gspeedlivingplus35@gmail.com}
      - STAFF_NOTIFICATION_EMAILS=${STAFF_NOTIFICATION_EMAILS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - glp-server-data:/app/data
    networks:
      - glp-network

networks:
  glp-network:
    driver: bridge

volumes:
  glp-server-data:
    driver: local
