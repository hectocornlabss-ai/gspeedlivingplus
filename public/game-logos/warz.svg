<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="warzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="warzRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="warzBiohazard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#warzBg)"/>
  <rect x="3" y="3" width="114" height="114" rx="25" fill="none" stroke="url(#warzRed)" stroke-width="2.5" opacity="0.85"/>

  <!-- Tactical Target / Biohazard Symbol -->
  <g transform="translate(10, 8)">
    <!-- Outer Crosshair Circle -->
    <circle cx="50" cy="46" r="32" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.4"/>
    <circle cx="50" cy="46" r="22" fill="none" stroke="#ea580c" stroke-width="2"/>
    <circle cx="50" cy="46" r="5" fill="#dc2626"/>

    <!-- Crosshairs -->
    <line x1="50" y1="10" x2="50" y2="28" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="50" y1="64" x2="50" y2="82" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="14" y1="46" x2="32" y2="46" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="68" y1="46" x2="86" y2="46" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Biohazard 3-arc shapes -->
    <path d="M42 36 C42 42 46 46 50 46 C54 46 58 42 58 36 C55 33 45 33 42 36 Z" fill="#f59e0b" opacity="0.85"/>
    <path d="M38 52 C44 54 47 50 47 46 C45 42 40 40 36 43 C34 47 36 50 38 52 Z" fill="#f59e0b" opacity="0.85"/>
    <path d="M62 52 C56 54 53 50 53 46 C55 42 60 40 64 43 C66 47 64 50 62 52 Z" fill="#f59e0b" opacity="0.85"/>
  </g>

  <!-- Big Bold Stencil WAR Z Text -->
  <text x="60" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="url(#warzRed)" text-anchor="middle" letter-spacing="3">WAR Z</text>
</svg>
