version: '3.8'

services:
  gspeed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gspeed-esport-arena
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
