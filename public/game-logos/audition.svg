<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="auditionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="auditionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="120" height="120" rx="28" fill="#0f0728"/>
  <rect x="3" y="3" width="114" height="114" rx="25" fill="none" stroke="url(#auditionBg)" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Glowing Music Notes & Equalizer -->
  <g transform="translate(10, 8)" filter="url(#auditionGlow)">
    <!-- Equalizer bars behind -->
    <rect x="22" y="60" width="6" height="24" rx="3" fill="#06b6d4" opacity="0.85"/>
    <rect x="32" y="48" width="6" height="36" rx="3" fill="#3b82f6" opacity="0.85"/>
    <rect x="42" y="38" width="6" height="46" rx="3" fill="#8b5cf6" opacity="0.85"/>
    <rect x="52" y="44" width="6" height="40" rx="3" fill="#ec4899" opacity="0.85"/>
    <rect x="62" y="52" width="6" height="32" rx="3" fill="#f43f5e" opacity="0.85"/>
    <rect x="72" y="62" width="6" height="22" rx="3" fill="#06b6d4" opacity="0.85"/>

    <!-- Dynamic Double Eighth Note (Music Symbol) -->
    <path d="M42 22 L72 16 L72 58 C69 56 65 55 60 56 C53 58 48 64 50 71 C52 77 59 81 66 79 C72 77 75 72 75 66 L75 25 L45 31 L45 66 C42 64 38 63 33 64 C26 66 21 72 23 79 C25 85 32 89 39 87 C45 85 48 80 48 74 L48 22 Z" 
          fill="#ffffff" stroke="#ec4899" stroke-width="2" stroke-linejoin="round"/>

    <!-- Sparkles -->
    <path d="M78 28 L82 35 L89 39 L82 43 L78 50 L74 43 L67 39 L74 35 Z" fill="#fde047"/>
    <circle cx="28" cy="30" r="3" fill="#38bdf8"/>
    <circle cx="86" cy="68" r="2.5" fill="#f472b6"/>
  </g>

  <!-- Text AU mini label -->
  <text x="60" y="106" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">AUDITION</text>
</svg>
