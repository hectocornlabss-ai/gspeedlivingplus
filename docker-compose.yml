version: '3.8'

services:
  # 1. Frontend Web SPA & Nginx Server
  gspeed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gspeed-esport-arena
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - email-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - glp-network

  # 2. Hostinger SMTP & Notification Microservice (Node.js Express)
  email-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: glp-email-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - glp-network

networks:
  glp-network:
    driver: bridge
